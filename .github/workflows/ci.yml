name: release-gate

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source binding
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
      - name: Bind reproducible build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Verify and install locked Python environment
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run --locked python -m ruff check .
      - name: Type check
        run: uv run --locked python -m mypy olympus scripts tests
      - name: Verify frozen readiness baseline
        run: uv run --locked python scripts/verify_readiness_baseline.py
      - name: Test with branch coverage
        run: uv run --locked python -m pytest --cov=olympus --cov-branch --cov-report=term-missing -q
      - name: Verify Foundry golden path
        run: |
          uv run --locked python -m olympus.cli foundry verify-pipeline --root artifacts/ci-foundry
          uv run --locked python -m olympus.cli foundry status --root artifacts/ci-foundry
          uv run --locked python -m olympus.cli foundry prepare-dataset --output artifacts/ci-deep-dataset
      - name: Audit Python dependencies
        run: |
          uv export --locked --all-extras --no-emit-project --no-hashes --format requirements-txt --output-file /tmp/olympus-locked-requirements.txt
          uv run --locked python -m pip_audit --strict -r /tmp/olympus-locked-requirements.txt
      - name: Build distributions
        run: uv run --locked python -m build --no-isolation
      - name: Validate distribution metadata
        run: uv run --locked python -m twine check dist/*
      - name: Verify bundled Foundry corpus
        run: |
          unzip -l dist/*.whl | grep 'olympus/foundry/foundry_verification.txt'
          unzip -l dist/*.whl | grep 'share/olympus/datasets/source.jsonl'
          tar -tzf dist/*.tar.gz | grep 'scripts/validate_editclevr_payload.py'
          if tar -tzf dist/*.tar.gz | grep -q 'datasets/external/'; then
            echo 'external research data must not be bundled in the source distribution'
            exit 1
          fi

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/forge-web
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify exact source binding
        shell: bash
        working-directory: .
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/forge-web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Audit dependency graph
        run: npm audit --audit-level=moderate
      - name: Build production assets
        run: npm run build
