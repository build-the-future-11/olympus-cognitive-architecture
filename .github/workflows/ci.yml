name: release-gate

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install locked Python environment
        run: python -m pip install uv==0.12.5 && uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy olympus tests
      - name: Test with branch coverage
        run: uv run pytest --cov=olympus --cov-branch --cov-report=term-missing -q
      - name: Verify Foundry golden path
        run: |
          uv run python -m olympus.cli foundry verify-pipeline --root artifacts/ci-foundry
          uv run python -m olympus.cli foundry status --root artifacts/ci-foundry
          uv run python -m olympus.cli foundry prepare-dataset --output artifacts/ci-deep-dataset
      - name: Audit Python dependencies
        run: uv run python scripts/audit_locked_dependencies.py
      - name: Build distributions
        run: >-
          uv run python scripts/build_release_artifacts.py
          --outdir dist --verify-reproducible
      - name: Validate distribution metadata
        run: uv run python -m twine check dist/*
      - name: Validate distribution payload
        run: uv run python scripts/validate_distribution_payload.py dist/*.whl dist/*.tar.gz
      - name: Validate installed wheel outside source checkout
        run: >-
          uv run python scripts/validate_installed_wheel.py
          dist/*.whl --temporary-parent "${RUNNER_TEMP}"
      - name: Verify bundled Foundry corpus
        run: |
          unzip -l dist/*.whl | grep 'olympus/foundry/foundry_verification.txt'
          unzip -l dist/*.whl | grep 'share/olympus/datasets/source.jsonl'

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/forge-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/forge-web/package-lock.json
      - name: Install locked dependencies
        run: corepack npm ci
      - name: Test
        run: corepack npm test
      - name: Audit dependency graph
        run: corepack npm audit --audit-level=moderate
      - name: Build production assets
        run: corepack npm run build

  pantheon:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OlympusC/05_pantheon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install locked Pantheon environment
        run: python -m pip install uv==0.12.5 && uv sync --locked --all-extras
      - name: Install checksum-pinned Tectonic paper compiler
        run: |
          ../../scripts/install_tectonic.sh "${RUNNER_TEMP}/tectonic-bin"
          echo "${RUNNER_TEMP}/tectonic-bin" >> "${GITHUB_PATH}"
      - name: Verify complete Pantheon boundary
        run: make verify PYTHON=.venv/bin/python
