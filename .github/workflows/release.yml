name: publish-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    needs: pantheon-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: pypi
      url: https://pypi.org/project/olympus-cognitive-architecture/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/forge-web/package-lock.json

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Install locked Python release environment
        run: python -m pip install uv==0.12.5 && uv sync --locked --all-extras
      - name: Install locked web dependencies
        working-directory: apps/forge-web
        run: corepack npm ci
      - name: Verify Python release gate
        run: |
          uv run ruff check .
          uv run mypy olympus tests
          uv run pytest --cov=olympus --cov-branch --cov-report=term-missing -q
          uv run python -m olympus.cli foundry verify-pipeline --root artifacts/release-foundry
          uv run python -m olympus.cli foundry status --root artifacts/release-foundry
          uv run python -m olympus.cli foundry prepare-dataset --output artifacts/release-deep-dataset
          uv run python -m pip_audit --strict .
      - name: Verify web release gate
        working-directory: apps/forge-web
        run: |
          corepack npm test
          corepack npm audit --audit-level=moderate
          corepack npm run build

      - name: Build Python distributions
        run: |
          test -z "$(git status --porcelain --untracked-files=no)"
          uv run python -m build
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - name: Validate distribution metadata
        run: uv run python -m twine check dist/*
      - name: Verify bundled Foundry corpus
        run: |
          unzip -l dist/*.whl | grep 'olympus/foundry/foundry_verification.txt'
          unzip -l dist/*.whl | grep 'share/olympus/datasets/source.jsonl'
      - name: Generate CycloneDX SBOMs
        run: |
          mkdir -p sbom
          uv run python -m pip_audit --strict --format cyclonedx-json --output sbom/olympus-python.cdx.json .
          cd apps/forge-web
          corepack npm sbom --sbom-format cyclonedx > ../../sbom/olympus-web.cdx.json
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            sbom/*

      - name: Publish Python distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* sbom/* --generate-notes --verify-tag

  pantheon-boundary:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: OlympusC/05_pantheon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install locked Pantheon environment
        run: python -m pip install uv==0.12.5 && uv sync --locked --all-extras
      - name: Verify Pantheon boundary
        run: |
          uv run pytest -q
          uv run python scripts/validate_evidence.py
