name: publish-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: pypi
      url: https://pypi.org/project/olympus-cognitive-architecture/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: apps/forge-web/package-lock.json

      - name: Bind reproducible build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Verify and install locked Python release environment
        run: uv sync --locked --all-extras
      - name: Install locked web dependencies
        working-directory: apps/forge-web
        run: npm ci
      - name: Verify Python release gate
        run: |
          uv run --locked python -m ruff check .
          uv run --locked python -m mypy olympus scripts tests
          uv run --locked python -m pytest --cov=olympus --cov-branch --cov-report=term-missing -q
          uv run --locked python -m olympus.cli foundry verify-pipeline --root artifacts/release-foundry
          uv run --locked python -m olympus.cli foundry status --root artifacts/release-foundry
          uv run --locked python -m olympus.cli foundry prepare-dataset --output artifacts/release-deep-dataset
          uv export --locked --all-extras --no-emit-project --no-hashes --format requirements-txt --output-file /tmp/olympus-locked-requirements.txt
          uv run --locked python -m pip_audit --strict -r /tmp/olympus-locked-requirements.txt
      - name: Verify web release gate
        working-directory: apps/forge-web
        run: |
          npm test
          npm audit --audit-level=moderate
          npm run build

      - name: Build Python distributions
        run: uv run --locked python -m build --no-isolation
      - name: Validate distribution metadata
        run: uv run --locked python -m twine check dist/*
      - name: Verify bundled Foundry corpus
        run: |
          unzip -l dist/*.whl | grep 'olympus/foundry/foundry_verification.txt'
          unzip -l dist/*.whl | grep 'share/olympus/datasets/source.jsonl'
          tar -tzf dist/*.tar.gz | grep 'scripts/validate_editclevr_payload.py'
          if tar -tzf dist/*.tar.gz | grep -q 'datasets/external/'; then
            echo 'external research data must not be bundled in the source distribution'
            exit 1
          fi
      - name: Generate CycloneDX SBOMs
        run: |
          mkdir -p sbom
          uv run --locked python -m pip_audit --strict -r /tmp/olympus-locked-requirements.txt --format cyclonedx-json --output sbom/olympus-python.cdx.json
          cd apps/forge-web
          npm sbom --sbom-format cyclonedx > ../../sbom/olympus-web.cdx.json
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            sbom/*

      - name: Publish Python distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* sbom/* --generate-notes --verify-tag
