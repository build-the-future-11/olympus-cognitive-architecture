[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olympus-cognitive-architecture"
version = "0.2.0"
description = "A local research platform for cognitive behaviors, compilation, and evaluation."
readme = "README.md"
requires-python = ">=3.14"
authors = [
  { name = "Ryan" },
]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
keywords = [
  "agent evaluation",
  "behavior graphs",
  "cognitive architecture",
  "research tooling",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "cryptography>=50.0.2,<51",
  "fastapi>=0.139.0",
  "httpx>=0.28.1",
  "numpy>=2.5.1",
  "Pillow>=12.0.0",
  "pydantic>=2.13.4",
  "PyYAML>=6.0.3",
  "rich>=15.0.0",
  "torch>=2.11.0",
  "typer>=0.26.8",
  "uvicorn>=0.51.0",
]

[project.urls]
Homepage = "https://github.com/build-the-future-11/olympus-cognitive-architecture"
Documentation = "https://github.com/build-the-future-11/olympus-cognitive-architecture/tree/main/docs"
Issues = "https://github.com/build-the-future-11/olympus-cognitive-architecture/issues"
Source = "https://github.com/build-the-future-11/olympus-cognitive-architecture"

[project.optional-dependencies]
dev = [
  "build>=1.3.0",
  "mypy>=2.3.0",
  "pip-audit>=2.10.1,<3",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.15.21",
  "setuptools>=70",
  "twine>=6.2.0,<7",
  "types-PyYAML>=6.0.12.20250915",
  "wheel>=0.46.1",
]

[project.scripts]
olympus = "olympus.cli:app"

[tool.setuptools.packages.find]
include = ["olympus*"]
where = ["."]

[tool.setuptools.package-data]
"olympus.foundry" = ["*.txt"]

[tool.setuptools.data-files]
"share/olympus/datasets" = ["datasets/hermes-smoke/source.jsonl"]
"share/olympus/configs" = [
  "configs/llm-readiness-capability-v1.json",
  "configs/llm-readiness-evidence-v1.schema.json",
  "configs/llm-readiness-production-v1.json",
  "configs/llm-readiness-receipt-v1.schema.json",
  "configs/llm-readiness-report-v1.schema.json",
  "configs/llm-readiness-safety-v1.json",
  "configs/llm-readiness-trust-v1.schema.json",
  "configs/llm-readiness-trust-v1.json",
  "configs/llm-readiness-v1.json",
  "configs/olympus-reference-system.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
  "research/olympus_o1/upstream",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Immutable submitted notebooks embed exact frozen source/protocol strings.
# Keep their original bytes; CI verifies the independent SHA-256 manifest.
# All other rules still apply, and the standalone scientific sources are linted.
"research/multi_horizon_dynamics_v1/multi_horizon_dynamics_v1.ipynb" = ["E501", "I001"]
"research/multi_horizon_dynamics_v2/multi_horizon_dynamics_v2.ipynb" = ["E501", "I001"]
"research/multi_horizon_dynamics_v3_heavy/multi_horizon_dynamics_v3_heavy.ipynb" = ["E501", "I001"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
disallow_any_generics = false
exclude = ["apps/forge-web"]

[tool.coverage.run]
branch = true
source = ["olympus"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
