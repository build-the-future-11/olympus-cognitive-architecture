# Archived, not part of the Olympus runtime.
#
# This Compose file was retained for provenance after the audit found no Python
# client, schema, or execution path using either service.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: olympus
      POSTGRES_PASSWORD: ${OLYMPUS_POSTGRES_PASSWORD:?set OLYMPUS_POSTGRES_PASSWORD}
      POSTGRES_DB: olympus
    ports:
      - "127.0.0.1:${OLYMPUS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${OLYMPUS_REDIS_PORT:-6379}:6379"

volumes:
  postgres-data:
